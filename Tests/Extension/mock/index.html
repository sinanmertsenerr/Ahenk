<!doctype html>
<!-- A stand-in for a music site, served by Tests/Extension/e2e.mjs to a test
     browser in place of music.youtube.com (nothing reaches the real site).
     Its structure follows the site's own element names so the extension's
     site adapter runs unchanged; every song, artist and line is invented. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Mock Music</title>
    <style>
      body { font: 14px -apple-system, sans-serif; margin: 0; display: grid; grid-template-columns: 200px 1fr 260px; min-height: 100vh; }
      ytmusic-guide-renderer, ytmusic-player-queue { display: block; padding: 12px; background: #f2f2f2; }
      ytmusic-guide-renderer a { display: block; padding: 4px 0; }
      #content { padding: 12px; }
      ytmusic-responsive-list-item-renderer, ytmusic-player-queue-item { display: flex; gap: 8px; padding: 4px 0; align-items: center; }
      ytmusic-play-button-renderer, tp-yt-paper-icon-button { display: inline-block; cursor: pointer; padding: 2px 6px; border: 1px solid #999; border-radius: 4px; }
      ytmusic-player-bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 10px; background: #222; color: #fff; align-items: center; }
      ytmusic-app { display: contents; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <ytmusic-app>
    <ytmusic-guide-renderer id="guide"></ytmusic-guide-renderer>
    <div id="content"></div>
    <ytmusic-player-queue id="queue"></ytmusic-player-queue>
    <div id="movie_player"></div>
    <ytmusic-player-bar id="bar" repeat-mode="NONE">
      <tp-yt-paper-icon-button class="previous-button" title="Previous">⏮</tp-yt-paper-icon-button>
      <tp-yt-paper-icon-button id="play-pause-button" class="play-pause-button" title="Play">⏯</tp-yt-paper-icon-button>
      <tp-yt-paper-icon-button class="next-button" title="Next">⏭</tp-yt-paper-icon-button>
      <div class="middle-controls">
        <yt-formatted-string class="title"></yt-formatted-string>
        <span class="subtitle"><yt-formatted-string class="byline"></yt-formatted-string></span>
      </div>
      <ytmusic-like-button-renderer id="like-button-renderer" like-status="INDIFFERENT">
        <div id="button-shape-like"><button aria-pressed="false" title="Like">♡</button></div>
      </ytmusic-like-button-renderer>
      <tp-yt-paper-icon-button class="shuffle" aria-pressed="false" title="Shuffle">🔀</tp-yt-paper-icon-button>
      <tp-yt-paper-icon-button class="repeat" title="Repeat">🔁</tp-yt-paper-icon-button>
    </ytmusic-player-bar>
    <audio id="tone" loop></audio>
    </ytmusic-app>
    <script src="/mock-site.js"></script>
  </body>
</html>
